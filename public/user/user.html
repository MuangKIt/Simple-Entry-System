<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staff App - Simple Entry System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/mobile-shared.css">
    <link rel="stylesheet" href="css/user.css"> <!-- ไฟล์นี้จะเหลือแค่โค้ดเฉพาะหน้า Home -->
</head>
<body class="mobile-body-bg">

    <!-- Mobile Wrapper (จำลองกรอบสมาร์ทโฟน) -->
    <div class="mobile-wrapper">
        
        <!-- ส่วนหัวแอปพลิเคชัน (App Header) -->
        <header class="app-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img id="userHeaderAvatar" src="https://ui-avatars.com/api/?name=User&background=4a6d8c&color=fff" alt="Profile" class="rounded-circle me-2" width="36" height="36">
                <div>
                    <div class="text-muted" style="font-size: 0.7rem; line-height: 1;">พนักงานคลังสินค้า</div>
                    <div class="fw-bold text-dark-blue" id="userHeaderName" style="font-size: 0.9rem;">สวัสดี...</div>
                </div>
            </div>
            <div class="d-flex gap-3">
                <a href="#" class="text-secondary position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                        <span class="visually-hidden">New alerts</span>
                    </span>
                </a>
                <a href="#" class="text-secondary">
                    <i class="bi bi-gear fs-5"></i>
                </a>
            </div>
        </header>

        <!-- พื้นที่เนื้อหาหลัก (Scrollable Content) -->
        <main class="app-content">
            
            <!-- วันที่และเวลา (Date & Time) -->
            <div class="mb-3 d-flex justify-content-between align-items-center">
                <div class="fw-semibold text-dark-blue" id="currentDate">4 ต.ค. 2026</div>
                <div class="badge bg-light text-primary-dark border"><i class="bi bi-clock me-1"></i> <span id="currentTime">08:00</span></div>
            </div>

            <!-- กล่องสรุปงานวันนี้ (Today's Stats) -->
            <h6 class="fw-bold text-dark-blue mb-2" style="font-size: 0.85rem;">ภาพรวมงานวันนี้</h6>
            <div class="row g-2 mb-3">
                
                <div class="col-6">
                    <div class="card stat-card bg-white border-0 shadow-sm h-100">
                        <div class="card-body p-2 d-flex align-items-center">
                            <div class="icon-box bg-success bg-opacity-10 text-success me-2">
                                <i class="bi bi-box-arrow-in-down"></i>
                            </div>
                            <div>
                                <div class="text-muted" style="font-size: 0.65rem;">รับเข้า (In)</div>
                                <div class="fw-bold fs-5 text-dark">12</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card stat-card bg-white border-0 shadow-sm h-100">
                        <div class="card-body p-2 d-flex align-items-center">
                            <div class="icon-box bg-warning bg-opacity-10 text-warning-custom me-2">
                                <i class="bi bi-box-arrow-up"></i>
                            </div>
                            <div>
                                <div class="text-muted" style="font-size: 0.65rem;">จ่ายออก (Out)</div>
                                <div class="fw-bold fs-5 text-dark">8</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ประกาศจากส่วนกลาง (Announcement) -->
            <div class="card border-0 shadow-sm mb-4 announcement-card">
                <div class="card-body p-3 d-flex align-items-start">
                    <i class="bi bi-megaphone-fill text-primary-dark mt-1 me-2 fs-5"></i>
                    <div>
                        <div class="fw-bold text-dark-blue" style="font-size: 0.8rem;">ประกาศจากส่วนกลาง</div>
                        <div class="text-muted" style="font-size: 0.75rem;">
                            วันนี้เวลา 14:00 น. จะมีสินค้าหมวด Hardware ล็อตใหญ่เข้ามา ขอให้เตรียมพื้นที่จัดเก็บ
                        </div>
                    </div>
                </div>
            </div>

            <!-- เมนูทำรายการหลัก (Core Operations) -->
            <h6 class="fw-bold text-dark-blue mb-2" style="font-size: 0.85rem;">ทำรายการ (Operations)</h6>
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <button class="btn btn-operation bg-tile-green text-white w-100 shadow-sm d-flex flex-column align-items-center justify-content-center">
                        <i class="bi bi-box-arrow-in-down mb-2"></i>
                        <span>รับสินค้าเข้า<br><small class="opacity-75">(Stock In)</small></span>
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-operation bg-tile-orange text-white w-100 shadow-sm d-flex flex-column align-items-center justify-content-center">
                        <i class="bi bi-box-arrow-up mb-2"></i>
                        <span>จ่ายสินค้าออก<br><small class="opacity-75">(Stock Out)</small></span>
                    </button>
                </div>
                <div class="col-12">
                    <button class="btn btn-operation bg-white text-dark-blue border w-100 shadow-sm d-flex align-items-center justify-content-center py-3">
                        <i class="bi bi-search fs-5 me-2 text-muted"></i>
                        <span class="fw-semibold">ค้นหา / เช็คสต็อก (Check Stock)</span>
                    </button>
                </div>
            </div>

            <!-- ประวัติการทำงานล่าสุด (My Recent Logs) -->
            <div class="d-flex justify-content-between align-items-end mb-2">
                <h6 class="fw-bold text-dark-blue mb-0" style="font-size: 0.85rem;">รายการล่าสุดของคุณ</h6>
                <a href="#" class="text-decoration-none text-muted" style="font-size: 0.7rem;">ดูทั้งหมด</a>
            </div>
            <div class="card border-0 shadow-sm mb-5">
                <ul class="list-group list-group-flush recent-logs">
                    <li class="list-group-item p-4 text-center text-muted" style="font-size: 0.8rem;">
                        <span class="spinner-border spinner-border-sm me-2"></span>กำลังโหลด...
                    </li>
                </ul>
            </div>
            
            <!-- Spacer สำหรับให้เลื่อนเนื้อหาเหนือ Bottom Nav ได้ -->
            <div style="height: 40px;"></div>

        </main>

        <!-- แถบเมนูด้านล่าง (Bottom Navigation Bar) -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <i class="bi bi-house-door-fill"></i>
                <span>หน้าแรก</span>
            </div>
            
            <!-- ปุ่ม Scan ตรงกลาง (Elevated Button) -->
            <div class="nav-item scan-btn-wrapper">
                <button class="scan-btn shadow">
                    <i class="bi bi-qr-code-scan"></i>
                </button>
            </div>
            
            <a href="profile.html" class="nav-item text-decoration-none">
                <i class="bi bi-person"></i>
                <span>โปรไฟล์</span>
            </a>
        </nav>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/user.js"></script>
</body>
</html>
