<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - Simple Entry System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/mobile-shared.css">
    <!-- Specific CSS -->
    <link rel="stylesheet" href="css/profile.css">
</head>
<body class="mobile-body-bg">

    <div class="mobile-wrapper bg-light">
        
        <!-- Header -->
        <header class="app-header sub-header d-flex justify-content-center align-items-center">
            <h6 class="fw-bold text-dark-blue mb-0">โปรไฟล์ส่วนตัว (Profile)</h6>
        </header>

        <!-- พื้นที่เนื้อหาหลัก -->
        <main class="app-content d-flex flex-column p-0 pb-5">
            
            <!-- ส่วนที่ 1: ข้อมูลพนักงาน (Employee Info Card) -->
            <div class="p-3">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-body text-center p-4">
                        <img id="profileAvatar" src="https://ui-avatars.com/api/?name=User&background=4a6d8c&color=fff&size=128" alt="Profile" class="rounded-circle mb-3 border border-4 border-light shadow-sm" width="80" height="80">
                        <h5 class="fw-bold text-dark-blue mb-1" id="profileName">
                            <span class="spinner-border spinner-border-sm text-secondary me-1"></span>กำลังโหลด...
                        </h5>
                        
                        <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
                            <span class="text-muted fw-semibold" id="profileEmpId" style="font-size: 0.8rem;">-</span>
                            <span class="badge bg-secondary bg-opacity-10 text-secondary border" id="profileRole">-</span>
                        </div>
                        
                        <!-- Gamification Stat -->
                        <div class="bg-light rounded-3 p-2 d-flex justify-content-center align-items-center mx-auto" style="max-width: 250px;">
                            <span class="text-muted" style="font-size: 0.75rem;">ทำรายการเดือนนี้: <strong class="text-dark" id="profileTxnCount">-</strong> ครั้ง</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 2: บัญชีและการตั้งค่า (Account Settings) -->
            <div class="px-3 mb-3 mt-2">
                <h6 class="fw-bold text-dark-blue mb-2 ps-1" style="font-size: 0.85rem;">บัญชีส่วนตัว (Account)</h6>
                <div class="list-group shadow-sm rounded-4 border-0">
                    <a href="#" class="list-group-item list-group-item-action d-flex align-items-center border-0 py-3" onclick="simulateNav('เปลี่ยนรหัสผ่าน')">
                        <div class="menu-icon bg-primary bg-opacity-10 text-primary me-3"><i class="bi bi-key-fill"></i></div>
                        <div class="flex-grow-1 fw-semibold text-dark" style="font-size: 0.85rem;">เปลี่ยนรหัสผ่าน (Change Password)</div>
                        <i class="bi bi-chevron-right text-muted small"></i>
                    </a>
                    <a href="#" class="list-group-item list-group-item-action d-flex align-items-center border-0 border-top py-3" onclick="simulateNav('ข้อมูลการติดต่อส่วนตัว')">
                        <div class="menu-icon bg-info bg-opacity-10 text-info me-3"><i class="bi bi-person-lines-fill"></i></div>
                        <div class="flex-grow-1 fw-semibold text-dark" style="font-size: 0.85rem;">ข้อมูลการติดต่อ (Contact Info)</div>
                        <i class="bi bi-chevron-right text-muted small"></i>
                    </a>
                </div>
            </div>

            <!-- ส่วนที่ 3: เครื่องมือและสนับสนุน (Support & Tools) -->
            <div class="px-3 mb-4">
                <h6 class="fw-bold text-dark-blue mb-2 ps-1" style="font-size: 0.85rem;">ช่วยเหลือ (Support)</h6>
                <div class="list-group shadow-sm rounded-4 border-0">
                    <a href="#" class="list-group-item list-group-item-action d-flex align-items-center border-0 py-3" onclick="simulateNav('คู่มือการใช้งาน')">
                        <div class="menu-icon bg-success bg-opacity-10 text-success me-3"><i class="bi bi-book-half"></i></div>
                        <div class="flex-grow-1 fw-semibold text-dark" style="font-size: 0.85rem;">คู่มือการใช้งาน (User Manual)</div>
                        <i class="bi bi-chevron-right text-muted small"></i>
                    </a>
                    <a href="#" class="list-group-item list-group-item-action d-flex align-items-center border-0 border-top py-3" onclick="simulateNav('รายงานปัญหา')">
                        <div class="menu-icon bg-warning bg-opacity-10 text-warning-custom me-3"><i class="bi bi-chat-square-text-fill"></i></div>
                        <div class="flex-grow-1 fw-semibold text-dark" style="font-size: 0.85rem;">รายงานปัญหา (Report Issue)</div>
                        <i class="bi bi-chevron-right text-muted small"></i>
                    </a>
                </div>
            </div>

            <!-- ส่วนที่ 4: ออกจากระบบ (Logout) -->
            <div class="px-3 mt-2">
                <button class="btn btn-logout w-100 py-3 rounded-4 shadow-sm" onclick="confirmLogout()">
                    <span class="fw-bold fs-6"><i class="bi bi-box-arrow-right me-2"></i>ออกจากระบบ</span>
                </button>
            </div>

            <!-- App Version -->
            <div class="text-center text-muted mt-4 mb-5" style="font-size: 0.7rem;">
                Simple Entry System v1.0.0
            </div>
            
            <div style="height: 30px;"></div>

        </main>

        <!-- แถบเมนูด้านล่าง (อิงจาก mobile-shared.css) -->
        <nav class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='user.html'">
                <i class="bi bi-house-door"></i>
                <span>หน้าแรก</span>
            </div>
            
            <div class="nav-item scan-btn-wrapper">
                <button class="scan-btn shadow" style="background-color: var(--muted-blue);">
                    <i class="bi bi-qr-code-scan"></i>
                </button>
            </div>
            
            <!-- เปลี่ยนสถานะ Active มาที่ Profile -->
            <div class="nav-item active">
                <i class="bi bi-person-fill"></i>
                <span>โปรไฟล์</span>
            </div>
        </nav>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
