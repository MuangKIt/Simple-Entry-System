<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check Stock - Simple Entry System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/mobile-shared.css">
    <!-- Specific CSS -->
    <link rel="stylesheet" href="css/check-stock.css">
</head>
<body class="mobile-body-bg">

    <div class="mobile-wrapper bg-light">
        
        <!-- Header -->
        <header class="app-header sub-header d-flex align-items-center justify-content-between">
            <a href="user.html" class="header-action-btn text-decoration-none">
                <i class="bi bi-chevron-left fs-5"></i>
            </a>
            <h6 class="fw-bold text-dark-blue mb-0 flex-grow-1 text-center">ค้นหาและเช็คสต็อก (Check Stock)</h6>
            <button class="btn p-0 header-action-btn border-0 shadow-none" id="btnRefresh" title="รีเฟรชข้อมูล">
                <i class="bi bi-arrow-clockwise fs-5"></i>
            </button>
        </header>

        <!-- พื้นที่เนื้อหาหลัก -->
        <main class="app-content d-flex flex-column p-3">
            
            <!-- ช่องค้นหาสินค้า -->
            <div class="mb-3">
                <div class="input-group search-group shadow-sm">
                    <span class="input-group-text border-end-0 text-muted"><i class="bi bi-search fs-6"></i></span>
                    <input type="text" class="form-control border-start-0 border-end-0 shadow-none fs-6 px-1" id="searchInput" placeholder="ค้นหา SKU หรือชื่อสินค้า...">
                    <button class="btn border-start-0 text-muted shadow-none px-3" type="button" id="scanBtn" title="สแกนบาร์โค้ด">
                        <i class="bi bi-upc-scan fs-5 text-dark-blue"></i>
                    </button>
                </div>
            </div>

            <!-- ตัวกรองหมวดหมู่ (Category Chips) -->
            <div class="mb-2">
                <div class="text-muted fw-semibold mb-1" style="font-size: 0.7rem;">หมวดหมู่สินค้า:</div>
                <div class="filter-chip-row" id="categoryChips">
                    <button class="filter-chip active" data-cat="">ทั้งหมด</button>
                    <button class="filter-chip" data-cat="Hardware">Hardware</button>
                    <button class="filter-chip" data-cat="Network">Network</button>
                    <button class="filter-chip" data-cat="Accessory">Accessory</button>
                </div>
            </div>

            <!-- ตัวกรองสถานะสต็อก (Status Chips) -->
            <div class="mb-3">
                <div class="text-muted fw-semibold mb-1" style="font-size: 0.7rem;">สถานะสินค้า:</div>
                <div class="filter-chip-row" id="statusChips">
                    <button class="filter-chip active" data-status="">ทั้งหมด</button>
                    <button class="filter-chip" data-status="In Stock">มีสินค้า</button>
                    <button class="filter-chip" data-status="Low Stock">ใกล้หมด</button>
                    <button class="filter-chip" data-status="Out of Stock">สินค้าหมด</button>
                </div>
            </div>

            <!-- จำนวนผลลัพธ์ -->
            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <span class="text-muted" style="font-size: 0.75rem;" id="resultCount">กำลังโหลดข้อมูล...</span>
                <span class="text-muted" style="font-size: 0.7rem;" id="lastUpdateText">อัปเดตล่าสุด: เมื่อสักครู่</span>
            </div>

            <!-- รายการการ์ดสินค้า (Rendered Dynamically) -->
            <div class="d-flex flex-column gap-2 mb-4" id="stockCardList">
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm text-secondary me-2"></div>
                    กำลังดึงข้อมูลสต็อก...
                </div>
            </div>

            <!-- พื้นที่เว้นระยะเผื่อ Bottom Navigation -->
            <div style="height: 60px;"></div>

        </main>

        <!-- แถบเมนูด้านล่าง (Bottom Navigation Bar) -->
        <nav class="bottom-nav">
            <a href="user.html" class="nav-item text-decoration-none">
                <i class="bi bi-house-door"></i>
                <span>หน้าแรก</span>
            </a>
            
            <div class="nav-item scan-btn-wrapper">
                <button class="scan-btn shadow" style="background-color: var(--muted-blue);" onclick="alert('โหมดสแกนบาร์โค้ดผ่านกล้อง (ฟังก์ชันจำลองสำหรับ Demo)')">
                    <i class="bi bi-qr-code-scan"></i>
                </button>
            </div>
            
            <a href="profile.html" class="nav-item text-decoration-none">
                <i class="bi bi-person"></i>
                <span>โปรไฟล์</span>
            </a>
        </nav>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Check Stock JS -->
    <script src="js/check-stock.js"></script>
</body>
</html>
